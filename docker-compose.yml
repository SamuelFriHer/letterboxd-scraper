services:
  scraper:
    # Dockerfile está en este directorio
    build: .

    # El directorio de trabajo DENTRO del contenedor
    working_dir: /app

    # Soluciona permisos de archivos
    user: '${UID}:${GID}'

    # Required for Chromium sandbox without granting SYS_ADMIN privileges
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb

    # Volúmenes:
    volumes:
      # Monta el código local en /app
      - .:/app

    # El comando que se ejecutará
    command: sh -c "npm install && npm start"
